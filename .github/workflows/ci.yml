name: CI

"on":
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    env:
      REGISTRY: 192.168.1.222:30500
      APP_NAME: backstage
      IMAGE_REPOSITORY: backstage
      IMAGE_TAG_PREFIX: build
      K8S_NAMESPACE: backstage
      K8S_DEPLOYMENT: backstage
      K8S_CONTAINER: backstage
      KUBE_CONTEXT: default
      EXPECTED_KUBE_SERVER: https://192.168.1.222:6443
      HTTP_PROXY: ${{ secrets.BUILD_HTTP_PROXY }}
      HTTPS_PROXY: ${{ secrets.BUILD_HTTPS_PROXY }}
      NO_PROXY: 127.0.0.1,localhost,10.0.0.0/8,10.43.0.0/16,10.42.0.0/16,192.168.1.222,192.168.1.222:30500,.svc,.cluster.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          docker version
          kubectl version --client
          node --version
          yarn --version

      - name: Verify 222 access
        run: |
          if ($env:KUBE_CONTEXT -match "(?i)aks|uat") {
            throw "Refusing to operate on AKS/UAT context '$env:KUBE_CONTEXT'."
          }

          $server = kubectl --context $env:KUBE_CONTEXT config view --minify -o jsonpath="{.clusters[0].cluster.server}"
          if ($server -ne $env:EXPECTED_KUBE_SERVER) {
            throw "Refusing to deploy to '$server'. Expected '$env:EXPECTED_KUBE_SERVER'."
          }

          $registryHealth = Invoke-WebRequest -UseBasicParsing -Uri "http://$env:REGISTRY/v2/" -TimeoutSec 10
          if ($registryHealth.StatusCode -ne 200) {
            throw "Registry health check failed with status $($registryHealth.StatusCode)."
          }

      - name: Verify Docker registry access
        run: |
          $dockerInfo = docker info 2>&1 | Out-String
          if ($dockerInfo -notmatch [regex]::Escape($env:REGISTRY)) {
            Write-Host $dockerInfo
            throw "Docker daemon is not configured to push to the HTTP registry $env:REGISTRY. Add it to Docker insecure-registries on the self-hosted runner."
          }

      - name: Prepare image tag
        run: |
          $timestamp = Get-Date -Format 'yyyyMMddHHmmss'
          $imageTag = "$env:IMAGE_TAG_PREFIX-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT-$timestamp"
          $imageName = "$env:REGISTRY/$env:IMAGE_REPOSITORY`:$imageTag"
          "IMAGE_TAG=$imageTag" >> $env:GITHUB_ENV
          "IMAGE_NAME=$imageName" >> $env:GITHUB_ENV
          "BUILD_ID=$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
          Write-Host "Image: $imageName"

      - name: Build Backstage backend bundle
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:backend

      - name: Build Docker image
        run: |
          $args = @("build", "--tag", $env:IMAGE_NAME, "--file", "packages/backend/Dockerfile")
          foreach ($name in @("HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) {
              $args += @("--build-arg", "$name=$value")
              $args += @("--build-arg", "$($name.ToLowerInvariant())=$value")
            }
          }
          $args += "."
          docker @args

      - name: Push Docker image to 222 registry
        run: |
          docker push $env:IMAGE_NAME

      - name: Deploy to 222 Kubernetes
        run: |
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\platform\namespaces.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\postgres-secrets.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\postgres-storage.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\postgres.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\postgres-service.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\backstage-kubernetes-rbac.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\backstage-config.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\backstage-github-oauth-secret.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\backstage.yaml
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\k8s\aiops\backstage\backstage-service.yaml

          kubectl --context $env:KUBE_CONTEXT set image deployment/$env:K8S_DEPLOYMENT $env:K8S_CONTAINER=$env:IMAGE_NAME -n $env:K8S_NAMESPACE
          kubectl --context $env:KUBE_CONTEXT annotate deployment/$env:K8S_DEPLOYMENT -n $env:K8S_NAMESPACE `
            aiops.io/build-id=$env:BUILD_ID `
            aiops.io/image-tag=$env:IMAGE_TAG `
            aiops.io/github-run-id=$env:GITHUB_RUN_ID `
            aiops.io/github-run-number=$env:GITHUB_RUN_NUMBER `
            aiops.io/github-sha=$env:GITHUB_SHA `
            --overwrite

          kubectl --context $env:KUBE_CONTEXT rollout status deployment/postgres -n $env:K8S_NAMESPACE --timeout=180s
          kubectl --context $env:KUBE_CONTEXT rollout status deployment/$env:K8S_DEPLOYMENT -n $env:K8S_NAMESPACE --timeout=300s

      - name: Verify deployment
        run: |
          kubectl --context $env:KUBE_CONTEXT get deployment/$env:K8S_DEPLOYMENT -n $env:K8S_NAMESPACE -o jsonpath="{.spec.template.spec.containers[0].image}"
          Write-Host ""
          kubectl --context $env:KUBE_CONTEXT get pods -n $env:K8S_NAMESPACE -l app=$env:APP_NAME
          kubectl --context $env:KUBE_CONTEXT get svc -n $env:K8S_NAMESPACE $env:APP_NAME
